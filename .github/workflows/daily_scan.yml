name: Daily Qullamaggie Scan
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Create Alpaca Config
        run: |
          echo '{"api_key": "${{ secrets.ALPACA_API_KEY }}", "secret_key": "${{ secrets.ALPACA_SECRET_KEY }}"}' > alpaca_config.json
      - name: Run Scanner
        run: python qullamaggie_scanner.py
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_results/
          
